name: Self-censoring package checks
on:
  push:
    branches: [self-censoring, ensemble-psd-comparison]
  pull_request:
    branches: [self-censoring]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            github::idiazst/cmbridge@57b3ee2c2a9ead38d9a8b4c662ec2bc6900df2b1
          needs: check
      - name: Check lmtp package and integration tests
        shell: Rscript {0}
        run: rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error", check_dir = "check")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lmtp-self-censoring-check
          path: check/
